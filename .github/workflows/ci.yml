name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Smoke Train
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

      - name: Run End-to-End CLI Smoke Test
        run: |
          python src/train.py --model xgboost --feature-set realtime --n-samples 1000 --n-estimators 30 --max-depth 4
          python src/train.py --model lightgbm --feature-set realtime --n-samples 1000 --n-estimators 30 --max-depth 4
